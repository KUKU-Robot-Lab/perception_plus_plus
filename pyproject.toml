[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perception-plus-plus"
version = "0.1.0"
description = "ROS-independent core and ROS 2 adapter for FoundationPose++ cup tracking"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]
yolo = ["ultralytics>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["perception_plus_plus_core*"]

